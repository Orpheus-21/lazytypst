name: Release

on:
  # A tag such as v0.1.0 builds the archive and makes a GitHub release.
  push:
    tags: ["v*"]
  # A manual run is a dry run: it builds and checks the archive and keeps it as an artifact. It makes no release.
  workflow_dispatch:

# The jobs only read the repository, except the job that makes the release.
permissions:
  contents: read

# A release run is never stopped half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The tests run the real typst command. Fix its version, and check the file against a fixed hash.
  TYPST_VERSION: "0.15.1"
  TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
  TYPST_IGNORE_SYSTEM_FONTS: "true"

jobs:
  build:
    name: Build the archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # A static binary has no dependency on the C library of the machine, so it runs on old systems too.
          rustup target add x86_64-unknown-linux-musl
          rustc --version

      - name: Read the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$REF_TYPE" = tag ]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::The tag $REF_NAME has the version $tag_version, but Cargo.toml has the version $cargo_version."
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Read the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          heading=$(grep -m1 -F "## [${VERSION}]" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no entry for the version ${VERSION}."
            exit 1
          fi
          # A release must have a date. A dry run may still say "not yet released".
          if [ "$EVENT" = push ] && printf '%s' "$heading" | grep -qi 'not yet released'; then
            echo "::error::The entry for ${VERSION} in CHANGELOG.md still says \"not yet released\". Write the date first."
            exit 1
          fi
          # The text of the release is the entry of this version, without its heading.
          awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { on = 1; next } /^## \[/ && on { exit } on' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::The entry for ${VERSION} in CHANGELOG.md is empty."
            exit 1
          fi
          cat release-notes.md

      - name: Install Typst
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum --check
          tar -xJf typst.tar.xz
          mkdir -p "$HOME/.local/bin"
          install -m 755 typst-x86_64-unknown-linux-musl/typst "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      # A release only goes out from a commit that passes the tests.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Make the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="lazytypst-${VERSION}-x86_64-linux"
          mkdir -p "dist/${name}"
          install -m 755 target/x86_64-unknown-linux-musl/release/lazytypst "dist/${name}/lazytypst"
          strip "dist/${name}/lazytypst"
          install -m 644 README.md LICENSE "dist/${name}/"
          # A fixed order, owner, and time make the archive the same when the files are the same.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -C dist -cf - "${name}" | gzip -n > "dist/${name}.tar.gz"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist
          cat "dist/${name}.tar.gz.sha256"

      # The check uses the file that users download, not the file in the build folder.
      - name: Check the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="lazytypst-${VERSION}-x86_64-linux"
          (cd dist && sha256sum --check "${name}.tar.gz.sha256")
          check=$(mktemp -d)
          tar -xzf "dist/${name}.tar.gz" -C "$check"
          test -x "$check/${name}/lazytypst"
          test -f "$check/${name}/README.md"
          test -f "$check/${name}/LICENSE"
          ldd "$check/${name}/lazytypst" 2>&1 | grep -q 'not a dynamic executable'
          "$check/${name}/lazytypst" --version | tee version.txt
          test "$(sed -n 1p version.txt)" = "lazytypst ${VERSION}"
          sed -n 2p version.txt | grep -q '^typst '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/*.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: Make the GitHub release
    needs: build
    # Only a tag makes a release. A manual run stops after the build job.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files

      - name: Make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "lazytypst ${VERSION}" --notes-file release-notes.md ./*.tar.gz ./*.sha256
